services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    labels:
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.noste.xyz`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.routers.jellyfin.tls.certresolver=defaultresolver"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      - JELLYFIN_PublishedServerUrl=http://192.168.0.5
    volumes:
      - /home/noste/jellyfin/config:/config
      - /home/noste/sonarr/tv:/data/tvshows
      - /home/noste/radarr/movies:/data/movies
    networks:
      - public_network

networks:
  public_network:
    name: reverse_proxy_network
    external: true
